<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stunden">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4E8A5C">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Stunden erfassen</title>
<style>
:root{--acc:#4E8A5C;--accd:#3A6B46;--tint:#EAF4EC;--ink:#1B2126;--mut:#5A6570;--hair:#E3E6E8;--bg:#F4F7F5;--err:#B3261E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;line-height:1.35}
#app{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0 2px;color:var(--accd)}
.sub{color:var(--mut);font-size:14px;margin:0 0 10px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.nav button{width:48px;height:48px;border-radius:12px;border:1px solid var(--acc);background:#fff;color:var(--accd);font-size:24px;cursor:pointer}
.nav button[disabled]{opacity:.35}
.nav .m{font-size:19px;font-weight:700;text-align:center;flex:1}
.total{background:var(--acc);color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 12px}
.total b{font-size:30px;font-variant-numeric:tabular-nums}
.total span{font-size:14px;opacity:.92}
.msg{background:#FFF4E5;border:1px solid #F0C98B;color:#5C3B00;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.msg.err{background:#FDECEA;border-color:#F3B7B2;color:var(--err)}
.list{background:#fff;border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 104px 26px;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--hair);min-height:54px}
.row:last-child{border-bottom:0}
.row.we{background:#F7FAF8}
.row.has{background:var(--tint)}
.row .d{font-variant-numeric:tabular-nums}
.row .d small{color:var(--mut);margin-left:6px}
.row input{width:100%;font:inherit;font-size:18px;text-align:right;padding:8px 10px;border:1px solid #C9CFD3;border-radius:10px;background:#fff;color:var(--ink);min-height:44px;font-variant-numeric:tabular-nums}
.row input:disabled{background:transparent;border-color:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.row input.bad{border-color:var(--err)}
.st{font-size:18px;text-align:center}
.st.ok{color:var(--acc)}.st.sv{color:var(--mut)}.st.er{color:var(--err);cursor:pointer}
.hint{color:var(--mut);font-size:13.5px;margin:12px 2px}
.center{text-align:center;padding:60px 10px;color:var(--mut)}
.btn{display:block;width:100%;min-height:52px;border-radius:12px;border:0;background:var(--accd);color:#fff;font:inherit;font-weight:700;font-size:18px;cursor:pointer;margin:10px 0}
.btn.sec{background:#fff;color:var(--accd);border:1px solid var(--acc)}
.btn[disabled]{opacity:.55;cursor:default}
.tbl{background:#fff;border:1px solid var(--hair);border-radius:14px;overflow:hidden;margin:10px 0}
.tr{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
.tr:last-child{border-bottom:0}
.tr small{color:var(--mut);margin-left:6px}
.thanks{background:var(--tint);border:1px solid #BFDCC6;border-radius:14px;padding:16px;margin:10px 0;color:var(--accd)}
.thanks b{display:block;font-size:20px;margin-bottom:4px}
</style>
</head>
<body>
<div id="app"><p class="center">Lade …</p></div>
<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbzLURthGVd_o-W2aUW4RnsYRjn0UkTwVO19m7v2Hhtq-QFdGDQF5GkG---faGoFl-iuAg/exec';
  var WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  var MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  var token = (new URLSearchParams(location.search).get('t') || '').trim();
  var app = document.getElementById('app');
  var S = { data: null, month: null, busy: 0, view: 'list' };

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    (kids || []).forEach(function (c) { e.append(c && c.nodeType ? c : document.createTextNode(c == null ? '' : String(c))); });
    return e;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtH(v) { return (Math.round(v * 100) / 100).toFixed(2); }
  function monthLabel(ym) { return MON[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4); }
  function shift(ym, d) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + d; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + pad(m + 1); }
  function daysIn(ym) { return new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(); }

  var MAX_H = 12;
  var ERR_H = 'Bitte Stunden in Viertelstunden eingeben (z. B. 4, 4.25, 4.5 oder 4.75), höchstens ' + MAX_H + ' Stunden pro Tag.';
  // Nur Dezimalstunden in Viertelstunden (Komma oder Punkt), 0 bis MAX_H. Leer = 0 (Eintrag löschen).
  function parseHours(s) {
    s = String(s).trim().replace(',', '.');
    if (!s) return 0;
    if (!/^\d{1,2}(\.\d{1,2})?$/.test(s)) return NaN;
    var v = Number(s);
    if (!isFinite(v) || v < 0 || v > MAX_H) return NaN;
    if (Math.abs(v * 4 - Math.round(v * 4)) > 1e-9) return NaN;
    return v;
  }

  function call(params) {
    var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(API + (API.indexOf('?') < 0 ? '?' : '&') + q, { method: 'GET', redirect: 'follow' })
      .then(function (r) { return r.json(); });
  }

  function load(ym) {
    S.month = ym;
    return call({ action: 'list', t: token, m: ym }).then(function (d) {
      if (!d.ok) throw new Error(d.error || 'Fehler');
      S.data = d; S.month = d.month; render();
    }).catch(function (e) {
      app.replaceChildren(el('h1', {}, ['Stunden erfassen']), el('div', { class: 'msg err' }, [e.message === 'Failed to fetch' ? 'Keine Verbindung. Bitte Internet prüfen und die Seite neu laden.' : e.message]));
    });
  }

  function total() {
    var t = 0, n = 0, e = S.data.entries;
    Object.keys(e).forEach(function (k) { t += e[k]; n++; });
    return { t: t, n: n };
  }

  function fmtDate(date) { return date.slice(8, 10) + '.' + date.slice(5, 7) + '.' + date.slice(0, 4); }
  function wdOf(date) { return WD[new Date(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10)).getDay()]; }
  function totalCard(tt) {
    return el('div', { class: 'total' }, [el('div', {}, [el('span', {}, ['Total Stunden']), el('br'), el('span', {}, [tt.n + (tt.n === 1 ? ' Tag' : ' Tage')])]), el('b', {}, [fmtH(tt.t)])]);
  }
  // Übersicht: nur Tage mit eingetragenen Stunden
  function overview(d) {
    var keys = Object.keys(d.entries).sort();
    if (!keys.length) return el('div', { class: 'msg' }, ['In diesem Monat sind keine Stunden eingetragen.']);
    return el('div', { class: 'tbl' }, keys.map(function (k) {
      return el('div', { class: 'tr' }, [el('span', {}, [fmtDate(k), el('small', {}, [wdOf(k)])]), el('b', {}, [fmtH(d.entries[k])])]);
    }));
  }
  function errText(e) { return e.message === 'Failed to fetch' ? 'Keine Verbindung. Bitte nochmals versuchen.' : e.message; }

  function render() {
    var d = S.data;
    if (d.closed) renderDone();
    else if (S.view === 'review' && d.editable) renderReview();
    else { S.view = 'list'; renderList(); }
  }

  function renderReview() {
    var d = S.data, tt = total();
    var msgBox = el('div', {});
    var send = el('button', { class: 'btn', onclick: function () {
      send.disabled = true; send.textContent = 'Wird gesendet …';
      call({ action: 'submit', t: token, m: d.month }).then(function (r) {
        if (!r.ok) throw new Error(r.error || 'Fehler');
        d.closed = true; S.view = 'list'; render(); window.scrollTo(0, 0);
      }).catch(function (e) {
        send.disabled = false; send.textContent = 'Stunden abschicken';
        msgBox.replaceChildren(el('div', { class: 'msg err' }, [errText(e)]));
      });
    } }, ['Stunden abschicken']);
    app.replaceChildren(
      el('h1', {}, [d.name]),
      el('p', { class: 'sub' }, ['Übersicht ' + monthLabel(d.month) + ' – bitte prüfen']),
      totalCard(tt),
      msgBox,
      overview(d),
      send,
      el('button', { class: 'btn sec', onclick: function () { S.view = 'list'; render(); window.scrollTo(0, 0); } }, ['Zurück zum Bearbeiten']),
      el('p', { class: 'hint' }, ['Nach dem Abschicken ist der Monat gesperrt. Du kannst ihn mit «Nochmals bearbeiten» wieder öffnen.'])
    );
  }

  function renderDone() {
    var d = S.data, ym = d.month, cur = d.today.slice(0, 7), tt = total();
    var msgBox = el('div', {});
    var back = el('button', { 'aria-label': 'Vormonat', onclick: function () { S.view = 'list'; load(shift(ym, -1)); }, disabled: ym <= shift(cur, -12) }, ['‹']);
    var fwd = el('button', { 'aria-label': 'Folgemonat', onclick: function () { S.view = 'list'; load(shift(ym, 1)); }, disabled: ym >= cur }, ['›']);
    var again = d.editable ? el('button', { class: 'btn sec', onclick: function () {
      again.disabled = true;
      call({ action: 'reopen', t: token, m: ym }).then(function (r) {
        if (!r.ok) throw new Error(r.error || 'Fehler');
        d.closed = false; S.view = 'list'; render();
      }).catch(function (e) { again.disabled = false; msgBox.replaceChildren(el('div', { class: 'msg err' }, [errText(e)])); });
    } }, ['Nochmals bearbeiten']) : el('div', { class: 'msg' }, ['Dieser Monat ist abgeschlossen. Änderungen bitte Roger melden.']);
    app.replaceChildren(
      el('h1', {}, [d.name]),
      el('div', { class: 'nav' }, [back, el('div', { class: 'm' }, [monthLabel(ym)]), fwd]),
      el('div', { class: 'thanks' }, [el('b', {}, ['Vielen Dank!']), 'Deine Stunden für ' + monthLabel(ym) + ' sind übermittelt und gespeichert (Total ' + fmtH(tt.t) + ' Stunden).']),
      totalCard(tt),
      msgBox,
      overview(d),
      again
    );
  }

  function renderList() {
    var d = S.data, ym = d.month, cur = d.today.slice(0, 7);
    var tt = total();
    var totalH = el('b', {}, [fmtH(tt.t)]);
    var totalN = el('span', {}, [tt.n + (tt.n === 1 ? ' Tag' : ' Tage')]);
    var list = el('div', { class: 'list' });
    var n = daysIn(ym);
    for (var day = 1; day <= n; day++) {
      (function (day) {
        var date = ym + '-' + pad(day);
        var wd = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, day).getDay();
        var has = d.entries[date] !== undefined;
        var future = date > d.today;
        var inp = el('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-label': 'Stunden am ' + pad(day) + '.' + ym.slice(5, 7) + '.', placeholder: d.editable && !future ? '–' : '', disabled: !d.editable || future });
        if (has) inp.value = fmtH(d.entries[date]);
        var st = el('span', { class: 'st' }, [has ? '✓' : '']); if (has) st.classList.add('ok');
        var row = el('div', { class: 'row' + (wd === 0 || wd === 6 ? ' we' : '') + (has ? ' has' : '') }, [
          el('div', { class: 'd' }, [pad(day) + '.' + ym.slice(5, 7) + '.' + ym.slice(0, 4), el('small', {}, [WD[wd]])]), inp, st]);
        function save() {
          var v = parseHours(inp.value);
          var old = d.entries[date];
          if (isNaN(v)) { inp.classList.add('bad'); st.className = 'st er'; st.textContent = '!'; showMsg(ERR_H, true); return; }
          inp.classList.remove('bad'); msgBox.replaceChildren();
          if ((old === undefined && v === 0) || old === v) { inp.value = v ? fmtH(v) : ''; return; }
          st.className = 'st sv'; st.textContent = '…'; S.busy++;
          call({ action: 'set', t: token, date: date, hours: v }).then(function (r) {
            S.busy--;
            if (!r.ok) throw new Error(r.error || 'Fehler');
            if (v === 0) delete d.entries[date]; else d.entries[date] = v;
            inp.value = v ? fmtH(v) : '';
            row.classList.toggle('has', v > 0);
            st.className = 'st' + (v > 0 ? ' ok' : ''); st.textContent = v > 0 ? '✓' : '';
            var t2 = total(); totalH.textContent = fmtH(t2.t); totalN.textContent = t2.n + (t2.n === 1 ? ' Tag' : ' Tage');
          }).catch(function (e) {
            S.busy = Math.max(0, S.busy - 1);
            inp.classList.add('bad'); st.className = 'st er'; st.textContent = '!';
            var m = e.message === 'Failed to fetch' ? 'Nicht gespeichert: keine Verbindung. Bitte nochmals versuchen.' : e.message;
            showMsg(m, true); st.onclick = save;
          });
        }
        inp.addEventListener('change', save);
        inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') inp.blur(); });
        list.append(row);
      })(day);
    }
    var msgBox = el('div', { id: 'msgbox' });
    function showMsg(t, isErr) { msgBox.replaceChildren(el('div', { class: 'msg' + (isErr ? ' err' : '') }, [t])); }
    var back = el('button', { 'aria-label': 'Vormonat', onclick: function () { S.view = 'list'; load(shift(ym, -1)); }, disabled: ym <= shift(cur, -12) }, ['‹']);
    var fwd = el('button', { 'aria-label': 'Folgemonat', onclick: function () { S.view = 'list'; load(shift(ym, 1)); }, disabled: ym >= cur }, ['›']);
    function toReview() {
      if (S.busy) { showMsg('Bitte einen Moment warten, die Eingaben werden noch gespeichert.', true); return; }
      if (app.querySelector('input.bad')) { showMsg('Bitte zuerst die rot markierte Eingabe korrigieren oder leeren.', true); return; }
      S.view = 'review'; render(); window.scrollTo(0, 0);
    }
    app.replaceChildren(
      el('h1', {}, [d.name]),
      el('p', { class: 'sub' }, ['Stunden pro Tag eintragen. Leer lassen, wenn du nicht gearbeitet hast.']),
      el('div', { class: 'nav' }, [back, el('div', { class: 'm' }, [monthLabel(ym)]), fwd]),
      el('div', { class: 'total' }, [el('div', {}, [el('span', {}, ['Total Stunden']), el('br'), totalN]), totalH]),
      d.editable ? el('button', { class: 'btn', onclick: toReview }, ['Prüfen und abschliessen']) : '',
      msgBox,
      d.editable ? '' : el('div', { class: 'msg' }, ['Dieser Monat ist abgeschlossen. Änderungen bitte Roger melden.']),
      list,
      el('p', { class: 'hint' }, ['Eingabe in Stunden, nur Viertelstunden: 0.25, 0.5, 0.75, 1, 1.25 … (Komma oder Punkt), höchstens ' + MAX_H + ' Stunden pro Tag. Beispiel: 4 Std. 30 Min. = 4.5. Jede Eingabe wird sofort gespeichert; das Häkchen zeigt, dass sie angekommen ist.'])
    );
  }

  if (!token) { app.replaceChildren(el('h1', {}, ['Stunden erfassen']), el('div', { class: 'msg err' }, ['Dieser Link ist unvollständig. Bitte den Link von Roger öffnen.'])); return; }
  load(null);
  window.addEventListener('pageshow', function () { if (S.data && !S.busy) load(S.month); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.data && !S.busy) load(S.month); });
})();
</script>
</body>
</html>
